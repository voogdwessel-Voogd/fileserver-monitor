{% extends 'base.html' %}
{% block content %}

<div class="d-flex align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-activity me-1"></i>Live — afgelopen 5 minuten</h5>
    <span class="badge bg-secondary ms-3" id="last-update">Laden...</span>
    <span class="badge bg-primary ms-2" id="event-count">0 events</span>
</div>

<div class="table-responsive">
    <table class="table table-sm table-hover table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th class="text-nowrap">Tijdstip</th>
                <th>Gebruiker</th>
                <th>Bestand</th>
                <th>Proces</th>
                <th>Actie</th>
            </tr>
        </thead>
        <tbody id="live-tbody">
            <tr><td colspan="5" class="text-center text-muted py-3">Laden...</td></tr>
        </tbody>
    </table>
</div>

{% endblock %}

{% block scripts %}
<script>
const ACTION_BADGES = {
    read:   '<span class="badge bg-info text-dark">Lezen</span>',
    write:  '<span class="badge bg-warning text-dark">Schrijven</span>',
    delete: '<span class="badge bg-danger">Verwijderen</span>',
    other:  '<span class="badge bg-secondary">Overig</span>',
};

function esc(str) {
    if (!str) return '-';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function basename(path) {
    if (!path) return '-';
    return esc(path.replace(/\//g, '\\').split('\\').pop());
}

function refresh() {
    fetch('/api/live')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('live-tbody');
            document.getElementById('last-update').textContent =
                'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');
            document.getElementById('event-count').textContent =
                data.length + ' event(s)';

            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">'
                    + '<i class="bi bi-inbox fs-4 d-block mb-1"></i>Geen activiteit</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(e => `
                <tr>
                    <td class="text-nowrap small text-muted">${esc(e.timestamp)}</td>
                    <td>${esc(e.username)}</td>
                    <td class="text-truncate file-path" title="${esc(e.file_path)}">${esc(e.file_path)}</td>
                    <td class="small text-muted">${basename(e.process_name)}</td>
                    <td>${ACTION_BADGES[e.action] || ACTION_BADGES.other}</td>
                </tr>
            `).join('');
        })
        .catch(() => {
            document.getElementById('last-update').textContent = 'Verbindingsfout';
        });
}

refresh();
setInterval(refresh, 10000);
</script>
{% endblock %}
