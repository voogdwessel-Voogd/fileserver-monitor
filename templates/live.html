{% extends 'base.html' %}
{% block content %}

<div class="d-flex align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-activity me-1"></i>Live — momenteel geopende bestanden</h5>
    <span class="badge bg-secondary ms-3" id="last-update">Laden...</span>
    <span class="badge bg-primary ms-2" id="file-count">0 bestanden</span>
</div>

<div class="row mb-3">
    <div class="col-auto">
        <select id="server-select" class="form-select form-select-sm">
            {% for s in servers %}
            <option value="{{ s.hostname or 'local' }}">{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-sm table-hover table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Gebruiker</th>
                <th>Bestand</th>
                <th>Share pad</th>
                <th>File ID</th>
            </tr>
        </thead>
        <tbody id="live-tbody">
            <tr><td colspan="4" class="text-center text-muted py-3">Laden...</td></tr>
        </tbody>
    </table>
</div>

{% endblock %}

{% block scripts %}
<script>
function escapeHtml(str) {
    if (!str) return '-';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function refresh() {
    const server = document.getElementById('server-select').value;
    fetch('/api/live?server=' + encodeURIComponent(server))
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('live-tbody');
            const now = new Date().toLocaleTimeString('nl-NL');
            document.getElementById('last-update').textContent = 'Bijgewerkt: ' + now;
            document.getElementById('file-count').textContent = data.length + ' bestand(en)';

            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">'
                    + '<i class="bi bi-inbox fs-4 d-block mb-1"></i>Geen open bestanden</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(f => `
                <tr>
                    <td>${escapeHtml(f.ClientUserName)}</td>
                    <td class="text-truncate file-path" title="${escapeHtml(f.Path)}">${escapeHtml(f.Path)}</td>
                    <td>${escapeHtml(f.ShareRelativePath)}</td>
                    <td class="text-muted small">${escapeHtml(f.FileId)}</td>
                </tr>
            `).join('');
        })
        .catch(() => {
            document.getElementById('last-update').textContent = 'Verbindingsfout';
        });
}

refresh();
setInterval(refresh, 10000);
document.getElementById('server-select').addEventListener('change', refresh);
</script>
{% endblock %}
